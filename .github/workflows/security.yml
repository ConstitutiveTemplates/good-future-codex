name: Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (GitHub Actions static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # advanced-security: false prints findings to the console instead of
        # uploading SARIF, so no security-events: write is needed. Flip to the
        # default once the repo is public (or has Advanced Security).
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          inputs: .github/workflows
          # pin the zizmor cli: a 2026-09-07 zizmor release added new
          # audits and version: latest made every project's security
          # workflow go red at once.
          #
          # The action version above and this cli pin must move together:
          # the action ships an allowlist (support/versions) of cli versions
          # it can run, and rejects anything newer with "Unknown version".
          # 1.30.1 needs action v0.6.4+ -- against v0.6.3 the allowlist ends
          # at 1.30.0 and the job dies before scanning.
          version: "1.30.1"
