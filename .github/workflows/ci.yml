name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Validate sections corpus
        run: uv run --with pyyaml python tools/validate.py
      - name: Generated MANIFEST in sync
        run: uv run --with pyyaml python tools/manifest.py --check
      - name: Tests
        run: uv run --with pytest --with pyyaml python -m pytest -q
