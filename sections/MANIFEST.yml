# GENERATED by tools/manifest.py -- do not edit. Run `just manifest`.
#
# The kanon distribution index, derived from the YAML front matter of every
# sections/<tier>/<slug>.md plus sections/VOCABULARY.yml. Each row says
# WHERE a section wants to land (`placement`) and UNDER WHAT ABSTRACT
# CONDITION (`when`: a condition or a list meaning "any of these"), in
# kanon's own vocabulary -- never a consumer's flag name. `pack` is `core`
# or the extension pack whose conditions alone gate the section.
# `obligations` are the law-map obligation ids the section serves; law-map
# owns their freshness. `just check` and CI fail when this file is stale.

schema: 2
vocabulary:
  general:
    title: Unconditional
    values:
      always: every project that renders the sections
      ai_assisted: AI coding agents work in the repository
  axes:
    form:
      title: Distribution form
      values:
        library: a library / API package
        cli: a command-line / terminal tool
        web_api: an HTTP API or web service
        mcp: an MCP server or tool-calling agent code
    data:
      title: Data handled
      values:
        personal_data: processes personal data
        face_recognition: performs biometric identification or verification
        medtech: medical / SaMD software (clinical decisions or patient data)
        scraping: fetches third-party web content
        data_science: trains or evaluates models on datasets
    market:
      title: Market
      values:
        commercial: distributed commercially
        eu_market: offered on the EU market
        jp: offered in Japan / operates under Japanese law
  extensions:
    competitive-programming:
      title: Competitive programming and data competitions
      values:
        oj_code: code submitted to an online judge
        kaggle: a data-competition (Kaggle-style) workspace
    embedded:
      title: Embedded devices
      values:
        embedded: embedded / microcontroller firmware
  placement:
    agents_md: the AGENTS.md ethics appendix
    charter: a CHARTER.md, for scraping projects
    legal_md: a LEGAL.md checklist
    standalone: its own file
  status:
    draft: written but not yet reviewed; consumers should not render it
    active: reviewed; consumers render it when `when` matches
